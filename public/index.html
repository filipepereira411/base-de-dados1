<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controlo Comercial</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; background-color: #f4f7f6; color: #333; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .produto-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #f1f1f1; }
        .produto-item:last-child { border-bottom: none; }
        .preco { font-weight: bold; color: #27ae60; font-size: 1.1em; }
        button { background-color: #2ecc71; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #27ae60; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95em; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ecf0f1; }
        th { background-color: #f8f9fa; color: #34495e; }
        .total-badge { font-weight: bold; color: #2980b9; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Painel de Controlo Comercial</h1>
        
        <div class="grid">
            <!-- COLUNA 1: PRODUTOS -->
            <div class="card">
                <h2>Montra de Produtos</h2>
                <div id="lista-produtos">A carregar produtos da base de dados...</div>
            </div>

            <!-- COLUNA 2: HISTÓRICO -->
            <div class="card">
                <h2>Histórico de Vendas Recentes</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Venda ID</th>
                            <th>Total Faturado</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-vendas">
                        <tr><td colspan="2">A carregar vendas realizadas...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Carrega os produtos vindos da API do teu server.js
        async function carregarProdutos() {
            const container = document.getElementById('lista-produtos');
            try {
                const response = await fetch('/api/produtos');
                const produtos = await response.json();

                container.innerHTML = '';
                if (!produtos || produtos.length === 0) {
                    container.innerHTML = '<p>Nenhum produto disponível na base de dados.</p>';
                    return;
                }

                produtos.forEach(prod => {
                    const div = document.createElement('div');
                    div.className = 'produto-item';
                    
                    div.innerHTML = `
                        <div>
                            <strong>${prod.nome || 'Produto Sem Nome'}</strong>
                            <div class="preco">${Number(prod.preco || 0).toFixed(2)}€</div>
                        </div>
                        <button onclick="efetuarVenda(${prod.preco})">Vender</button>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="color:red;">Erro ao carregar produtos do servidor.</p>';
            }
        }

        // Função que envia o registo da venda para o teu servidor backend
        async function efetuarVenda(precoProduto) {
            try {
                const response = await fetch('/api/vendas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ total: precoProduto })
                });

                const resultado = await response.json();
                
                if (resultado.sucesso) {
                    // Atualiza a tabela do histórico logo após a venda
                    carregarHistoricoVendas();
                } else {
                    alert('Erro ao registar a venda no Supabase: ' + resultado.erro);
                }
            } catch (err) {
                console.error(err);
                alert('Erro na ligação com o servidor.');
            }
        }

        // Carrega o histórico de vendas vindo da API do teu server.js
        async function carregarHistoricoVendas() {
            const tabelaBody = document.getElementById('tabela-vendas');
            try {
                const response = await fetch('/api/vendas');
                const vendas = await response.json();

                tabelaBody.innerHTML = '';
                if (vendas && vendas.length > 0) {
                    vendas.forEach(venda => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>#${venda.id}</td>
                            <td class="total-badge">${Number(venda.total || 0).toFixed(2)}€</td>
                        `;
                        tabelaBody.appendChild(tr);
                    });
                } else {
                    tabelaBody.innerHTML = '<tr><td colspan="2">Nenhuma venda efetuada no sistema.</td></tr>';
                }
            } catch (err) {
                console.error(err);
                tabelaBody.innerHTML = '<tr><td colspan="2" style="color:red;">Erro ao carregar histórico.</td></tr>';
            }
        }

        // Executa ao abrir a página
        carregarProdutos();
        carregarHistoricoVendas();
    </script>
</body>
</html>
